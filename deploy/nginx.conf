worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    open_file_cache off;
    client_body_temp_path /run/client;
    proxy_temp_path /run/proxy;
    fastcgi_temp_path /run/fastcgi;
    uwsgi_temp_path /run/uwsgi;
    scgi_temp_path /run/scgi;
    map $server_port $release {
        8080 current;
        8081 candidate;
    }
    server {
        listen 8080;
        listen 8081;
        root /srv/site/$release;
        add_header X-Content-Type-Options nosniff always;
        location = / { try_files /index.html =404; add_header Cache-Control "no-store" always; }
        location = /index.html { add_header Cache-Control "no-store" always; }
        location = /version.json { add_header Cache-Control "no-store" always; }
        location /assets/ {
            alias /srv/site/assets/;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
        }
        location / { return 404; }
    }
}
